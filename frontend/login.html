<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Ledger</title>
  <script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem("tl-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.lang=localStorage.getItem("tl-lang")||"sr"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-shell">
    <div class="login-controls">
      <select class="lang-select" id="lang" data-i18n-aria="top.language"><option value="sr">SR</option><option value="en">EN</option></select>
      <button type="button" class="theme-toggle" id="themeToggle" data-i18n-aria="top.themeToggle"></button>
    </div>

    <section class="login-side">
      <a class="brand" href="login.html" aria-label="Token Ledger">
        <img class="brand-logo" src="img/logo.svg" alt="Token Ledger">
      </a>

      <form class="login-form" id="loginForm" novalidate>
        <h1 id="formTitle" data-i18n="login.title"></h1>
        <p class="sub" id="formSub" data-i18n="login.sub"></p>

        <button type="button" class="btn-google" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.33-1.58-5.04-3.7H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.28-1.72V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.06l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.94l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
          <span data-i18n="login.google"></span>
        </button>

        <div class="or"><span data-i18n="login.or"></span></div>

        <div class="field signup-only hidden">
          <label for="name" data-i18n="signup.name"></label>
          <input id="name" name="name" type="text" autocomplete="name">
        </div>
        <div class="field signup-only hidden">
          <label for="company" data-i18n="signup.company"></label>
          <input id="company" name="company" type="text" autocomplete="organization">
        </div>
        <div class="field">
          <label for="email" data-i18n="login.email"></label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="password" data-i18n="login.password"></label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" id="pwToggle" aria-pressed="false" aria-controls="password" data-i18n="login.show"></button>
          </div>
        </div>

        <div class="row login-only">
          <label class="check"><input type="checkbox" id="remember" checked> <span data-i18n="login.remember"></span></label>
          <button type="button" class="link-btn" id="forgot" data-i18n="login.forgot"></button>
        </div>

        <p class="msg" id="msg" role="status" aria-live="polite"></p>
        <button class="btn-primary" type="submit" id="submitBtn" data-i18n="login.submit"></button>
        <p class="foot login-only"><span data-i18n="login.noAccount"></span> <button type="button" class="link-btn" id="toSignup" data-i18n="login.signupLink"></button></p>
        <p class="foot signup-only hidden"><span data-i18n="signup.haveAccount"></span> <button type="button" class="link-btn" id="toLogin" data-i18n="signup.loginLink"></button></p>

        <div class="demo-hint hidden" id="demoHint">
          <span data-i18n="login.demo"></span><br>
          <button type="button" data-demo="admin@firma.rs">admin@firma.rs</button>
          <button type="button" data-demo="lead@firma.rs">lead@firma.rs</button>
          <button type="button" data-demo="observer@firma.rs">observer@firma.rs</button>
        </div>
      </form>
    </section>

    <aside class="login-visual">
      <canvas id="tesseract" aria-hidden="true"></canvas>
      <p class="tagline" data-i18n="login.tagline"></p>
      <button type="button" class="motion-toggle" id="motionToggle" aria-pressed="false" data-i18n="login.pause"></button>
    </aside>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
