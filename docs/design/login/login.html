<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("tl-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Token Ledger — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="login-shell">
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">Theme</button>
    <section class="login-side">
      <a class="brand" href="index.html" aria-label="Token Ledger home">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 36 11v18L20 38 4 29V11z" fill="currentColor" opacity=".17"/><path d="M20 2 36 11 20 20 4 11zM4 11v18l16 9V20zM36 11v18l-16 9V20z" fill="currentColor"/><path d="m20 2 0 18 16-9z" fill="#fff" opacity=".24"/></svg></span>
        <span>Token Ledger</span>
      </a>

      <form class="login-form" id="loginForm" novalidate>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to check your token spend</p>

        <button type="button" class="btn-google" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.33-1.58-5.04-3.7H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.28-1.72V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.06l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.94l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
          Log in with Google
        </button>

        <div class="or"><span>or</span></div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="pwToggle" aria-pressed="false" aria-controls="password">Show</button>
          </div>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox" id="remember" /> Remember me</label>
          <a href="#" id="forgot">Forgot password?</a>
        </div>

        <p class="msg" id="msg" role="status" aria-live="polite"></p>
        <button class="btn-primary" type="submit">Log in</button>
        <p class="foot">Don’t have an account? <a href="#" id="signup">Sign up for free</a></p>
      </form>
    </section>

    <aside class="login-visual">
      <canvas id="tesseract" aria-hidden="true"></canvas>
      <p class="tagline">Every token, accounted for.</p>
      <button type="button" class="motion-toggle" id="motionToggle" aria-pressed="false">Pause animation</button>
    </aside>
  </main>
  <script src="login.js"></script>
</body>
</html>
